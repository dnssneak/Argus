<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#141126"/>
            <stop offset="100%" stop-color="#07080e"/>
        </radialGradient>
        
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d8b4fe"/>
            <stop offset="50%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#9333ea"/>
        </linearGradient>

        <linearGradient id="purpleGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0abfc"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="14" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Outer Rounded Dark Container -->
    <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
    <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="4"/>

    <!-- Argus 3D Layered Diamond Logo Emblem -->
    <g transform="translate(64, 64) scale(16)" filter="url(#glow)">
        <!-- Bottom Layer -->
        <path d="M2 17l10 5 10-5" fill="none" stroke="url(#purpleGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Middle Layer -->
        <path d="M2 12l10 5 10-5" fill="none" stroke="url(#purpleGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Top Layer Filled Diamond -->
        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="rgba(168, 85, 247, 0.15)" stroke="url(#purpleGradLight)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
